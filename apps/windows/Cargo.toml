[package]
name = "video-studio-win"
description = "Syncfusion Video Studio for Windows: a windows-rs + WebView2 shell over video-studio-core (ui/spec.md §23)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# webview2-com needs 1.82
rust-version = "1.82"
build = "build.rs"

# Cargo names can't contain spaces: build.ps1 installs this as "Syncfusion Video Studio.exe".
[[bin]]
name = "video-studio-app"
path = "src/main.rs"

# UI Automation test runner (ui/spec.md §23.9 item 4)
[[bin]]
name = "vs-uitest"
path = "uitests/main.rs"
test = false

[dependencies]
base64 = "0.22.1"
camino = "1.1.9"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
video-studio-core = { version = "0.1.0", path = "../../crates/video-studio-core" }
video-studio-ffi = { version = "0.1.0", path = "../../crates/video-studio-ffi" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
