name: VideoStudio
options:
  bundleIdPrefix: com.syncfusion
  organizationName: Syncfusion Inc.
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
# Code signing lives in Signing.xcconfig, which a machine overrides in Signing.local.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # The Rust core is built for this Mac's architecture only, so the app is too (Release would
    # otherwise build a universal binary and fail to link the x86_64 half).
    ONLY_ACTIVE_ARCH: YES
  configs:
    # Debug builds are optimised too, so the self test's timing checks measure what the app really does.
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  MarkdownCore:
    type: framework
    platform: macOS
    sources: [Sources/MarkdownCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncfusion.videostudio.markdowncore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  VideoStudio:
    type: application
    platform: macOS
    sources:
      - Sources/VideoStudio
      - path: Generated/video_studio_ffi.swift
      - path: Resources/Preview
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - target: MarkdownCore
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: WebKit.framework
      - sdk: Quartz.framework
    preBuildScripts:
      - name: Build the Rust core and its Swift bindings
        script: |
          "$SRCROOT/scripts/build-core.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(SRCROOT)/build/core/libvideo_studio_ffi.a
          - $(SRCROOT)/Generated/video_studio_ffi.swift
    postBuildScripts:
      - name: Bundle the video-studio helper
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          cp "$SRCROOT/build/core/video-studio" "$DEST/video-studio"
          if [ "$CONFIGURATION" = "Debug" ]; then
            # Test doubles for the in-app self test.
            cp "$SRCROOT/build/core/vs-fake-claude" "$SRCROOT/build/core/vs-fake-cutline" "$DEST/"
          fi
          # Same signature as the app, so a signed app's helpers are signed with its certificate.
          # Notarized builds (hardened runtime, real certificate) need the helpers hardened and
          # timestamped too.
          FLAGS=""
          if [ "$ENABLE_HARDENED_RUNTIME" = "YES" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY:--}" != "-" ]; then
            FLAGS="--options runtime --timestamp"
          fi
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" $FLAGS "$DEST"/*
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_NAME: Syncfusion Video Studio
        PRODUCT_BUNDLE_IDENTIFIER: com.syncfusion.videostudio
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/VideoStudio.entitlements
        GENERATE_INFOPLIST_FILE: NO
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/core
        OTHER_LDFLAGS: "-lvideo_studio_ffi -framework Security -framework CoreFoundation -framework SystemConfiguration"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/Generated/video_studio_ffiFFI.modulemap"
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated
schemes:
  VideoStudio:
    build:
      targets:
        VideoStudio: all
    run:
      config: Debug
