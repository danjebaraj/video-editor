[package]
name = "video-studio-ffi"
description = "UniFFI bindings of video-studio-core for the macOS shell (and later the Windows shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "video_studio_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
camino = "1.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = { version = "0.29", features = ["cli"] }
video-studio-core = { version = "0.1.0", path = "../video-studio-core" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
