[package]
name = "cutline-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
cutline-core = { version = "0.1.0", path = "../cutline-core" }
cutline-deps = { version = "0.1.0", path = "../cutline-deps" }
cutline-media = { version = "0.1.0", path = "../cutline-media" }
cutline-qa = { version = "0.1.0", path = "../cutline-qa" }
cutline-testkit = { version = "0.1.0", path = "../cutline-testkit" }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[[bin]]
name = "cutline"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = "4.2.0"
