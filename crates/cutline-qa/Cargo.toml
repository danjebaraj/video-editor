[package]
name = "cutline-qa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
cutline-audio = { version = "0.1.0", path = "../cutline-audio" }
cutline-core = { version = "0.1.0", path = "../cutline-core" }
cutline-deps = { version = "0.1.0", path = "../cutline-deps" }
cutline-media = { version = "0.1.0", path = "../cutline-media" }
cutline-reframe = { version = "0.1.0", path = "../cutline-reframe" }
cutline-render = { version = "0.1.0", path = "../cutline-render" }
cutline-testkit = { version = "0.1.0", path = "../cutline-testkit" }
cutline-text = { version = "0.1.0", path = "../cutline-text" }
cutline-transcribe = { version = "0.1.0", path = "../cutline-transcribe" }
image = "0.25.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[features]
onnx = ["cutline-render/onnx"]

[lints]
workspace = true

[dev-dependencies]
image = "0.25.6"
tempfile = "3.27.0"
