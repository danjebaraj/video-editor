[package]
name = "cutline-html"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = { version = "0.9.1", default-features = false }
cutline-core = { version = "0.1.0", path = "../cutline-core" }
cutline-deps = { version = "0.1.0", path = "../cutline-deps" }
cutline-media = { version = "0.1.0", path = "../cutline-media" }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "fs"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
cutline-testkit = { path = "../cutline-testkit" }
image = "0.25.6"
tempfile = "3.27.0"
