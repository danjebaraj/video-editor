[package]
name = "video-studio-core"
description = "Syncfusion Video Studio core: project model, media references, validation, Claude Code runs, ElevenLabs helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
camino = { version = "1.1.9", features = ["serde1"] }
chrono = { version = "0.4.40", default-features = false, features = ["clock", "std"] }
cutline-core = { version = "0.1.0", path = "../cutline-core" }
fs2 = "0.4.3"
getrandom = "0.3.4"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3.6.2", features = ["apple-native", "windows-native"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# The Windows platform layer (ui/spec.md §23.4) and app recording backend (§23.7). Same `windows`
# version as webview2-com, so the Windows shell links one copy.
[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
cutline-deps = { version = "0.1.0", path = "../cutline-deps" }
cutline-media = { version = "0.1.0", path = "../cutline-media" }
tempfile = "3.27.0"

[lints]
workspace = true
