[package]
name = "video-studio-core"
description = "Syncfusion Video Studio core: project model, media references, validation, Claude Code runs, ElevenLabs helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
camino = { version = "1.1.9", features = ["serde1"] }
chrono = { version = "0.4.40", default-features = false, features = ["clock", "std"] }
cutline-core = { version = "0.1.0", path = "../cutline-core" }
fs2 = "0.4.3"
getrandom = "0.3.4"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3.6.2", features = ["apple-native", "windows-native"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
