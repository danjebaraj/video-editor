[package]
name = "video-studio-cli"
description = "Headless CLI for Syncfusion Video Studio (ui/spec.md §13) and the helper Claude uses during runs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "video-studio"
path = "src/main.rs"

[dependencies]
camino = "1.1.9"
clap = { version = "4.5.61", features = ["derive"] }
ctrlc = { version = "3.4.5", features = ["termination"] }
# the fake cutline writes JPEG stills (the core already builds the crate with these features)
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
video-studio-core = { version = "0.1.0", path = "../video-studio-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
video-studio-ffi = { path = "../video-studio-ffi" }

[target.'cfg(windows)'.dev-dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

# Test doubles (spec §20): a Claude Code CLI that replays a script, and a cutline that writes
# placeholder outputs. Used by this crate's end-to-end tests and the macOS app's self test.
[[bin]]
name = "vs-fake-claude"
path = "src/bin/fake_claude.rs"
test = false

[[bin]]
name = "vs-fake-cutline"
path = "src/bin/fake_cutline.rs"
test = false

# A Codex App Server double (FEAT-spry-alpaca-5RQZ)
[[bin]]
name = "vs-fake-codex"
path = "src/bin/fake_codex.rs"
test = false

# The Win32 app the Windows recording backend is tested against (ui/spec.md §23.7)
[[bin]]
name = "vs-capture-target"
path = "src/bin/capture_target.rs"
test = false
