name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cutline-${{ matrix.os }}
          path: dist/*.*
